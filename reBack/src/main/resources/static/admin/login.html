<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=M+PLUS+1+Code:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <title>管理画面ログイン</title>
  <link rel="stylesheet" href="./styles.css?v=20261006-receipt-redesign">
</head>
<body>
  <main class="container">
    <p class="page-actions"><a id="back-link" class="back-link" href="https://sr5msym6xbw3oil22im7.github.io/receipt-analysis/reFront/index.html">← メニューへ戻る</a></p>
    <section class="card login-card">
      <p class="eyebrow">Administrator</p>
      <h1>管理画面ログイン</h1>
      <div class="flourish"><svg aria-hidden="true" viewBox="0 0 32 32"><use href="#rc"/></svg></div>
      <form id="login-form">
        <div class="field">
          <label class="field-label" for="user-id">ユーザーID</label>
          <input id="user-id" name="username" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label class="field-label" for="password">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">ログイン</button>
        <p id="login-status" class="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="rc" viewBox="0 0 32 32">
      <path d="M8 4l2 2 2-2 2 2 2-2 2 2 2-2 2 2 2-2v24l-2-2-2 2-2-2-2 2-2-2-2 2-2-2-2 2z" style="fill:var(--paper)" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M11.5 11h9M11.5 14.5h6M11.5 18h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M11.5 21.5h9" stroke="currentColor" stroke-width="2.4" stroke-dasharray="1 1.2"/>
    </symbol>
  </svg>
  <script src="./config.js"></script>
  <script src="./admin-api.js?v=20261004-admin-only-receipt-api"></script>
  <script src="./login.js?v=20260924-login-destination-routing"></script>
</body>
</html>
