<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=M+PLUS+1+Code:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <title>保存済みレシート一覧</title>
  <link rel="stylesheet" href="./styles.css?v=20261006-receipt-redesign">
</head>
<body>
  <main class="container">
    <p class="page-actions"><a id="back-link" class="back-link" href="https://sr5msym6xbw3oil22im7.github.io/">← メニューへ戻る</a><button id="logout-button" class="secondary-button" type="button">ログアウト</button></p>
    <section class="card page-header">
      <p class="eyebrow">Saved Receipts</p>
      <h1>保存済みレシート一覧</h1>
      <div class="flourish"><svg aria-hidden="true" viewBox="0 0 32 32"><use href="#rc"/></svg></div>
      <p class="lead">保存されたレシートを参照・削除できます。</p>
    </section>

    <section class="card">
      <div class="button-row">
        <button id="delete-selected" class="danger-button hidden" type="button" disabled>チェックしたレシートを削除</button>
      </div>
      <p id="list-status" class="status" aria-live="polite">読み込み中...</p>
      <div id="receipt-list" class="receipt-list"></div>
    </section>
    <section id="detail-panel" class="card hidden" aria-live="polite">
      <div class="detail-heading">
        <h2>レシート詳細</h2>
        <div class="button-row">
          <button id="close-detail" class="secondary-button" type="button">閉じる</button>
        </div>
      </div>
      <div class="flourish"><svg aria-hidden="true" viewBox="0 0 32 32"><use href="#rc"/></svg></div>
      <p id="detail-meta" class="help-text"></p>
      <div id="detail-bubble" class="receipt-bubble"></div>
    </section>
  </main>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="rc" viewBox="0 0 32 32">
      <path d="M8 4l2 2 2-2 2 2 2-2 2 2 2-2 2 2 2-2v24l-2-2-2 2-2-2-2 2-2-2-2 2-2-2-2 2z" style="fill:var(--paper)" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M11.5 11h9M11.5 14.5h6M11.5 18h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M11.5 21.5h9" stroke="currentColor" stroke-width="2.4" stroke-dasharray="1 1.2"/>
    </symbol>
  </svg>
  <script src="./config.js"></script>
  <script src="./admin-api.js?v=20261004-admin-only-receipt-api"></script>
  <script src="./select.js?v=20261006-receipt-redesign"></script>
</body>
</html>
