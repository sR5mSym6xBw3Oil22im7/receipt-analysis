server:
  port: ${PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:receipt_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jdbc:
    template:
      query-timeout: 20s

app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5051}
  max-upload-bytes: 5242880

gemini:
  model: gemini-3.7-flash
