server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:receipt_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5500}
  max-upload-bytes: 5242880

gemini:
  model: gemini-2.5-flash-lite
