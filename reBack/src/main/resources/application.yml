server:
  port: ${PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:receipt_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jdbc:
    template:
      query-timeout: 20s
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}

app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5051}
  max-upload-bytes: 5242880

gemini:
  receipt-model: gemini-3.5-flash-lite
  image-model: ${GEMINI_IMAGE_MODEL:gemini-3.1-flash-image}
  image-timeout-ms: ${GEMINI_IMAGE_TIMEOUT_MS:180000}

receipt-game:
  room-expiration-minutes: ${RECEIPT_GAME_ROOM_EXPIRATION_MINUTES:60}
  generating-stale-minutes: ${RECEIPT_GAME_GENERATING_STALE_MINUTES:15}

logging:
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.zip"

