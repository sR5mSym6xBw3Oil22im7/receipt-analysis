<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Receipt Change Monster Game</title><link rel="stylesheet" href="./styles.css?v=receipt-game-v1"><script src="./access-guard.js"></script></head>
<body><main class="container game-container"><p><a href="./index.html">← メニューへ戻る</a></p><section class="card"><p class="game-eyebrow">RECEIPT CHANGE MONSTER</p><h1>レシートバトルゲーム</h1><p>最大10枚のレシートから1枚を選び、生成されたモンスターで一発勝負します。レシート画像はJPEG / PNG / ZIP、1枚5MB以下です。ZIPはJPEG/PNGのレシート画像をまとめて解析できます。</p><div class="game-mode-row"><button id="local-mode" class="mode-button active" type="button">同じPCで対戦</button><button id="room-mode" class="mode-button" type="button">2台PCで対戦</button></div><div id="room-panel" class="hidden"><div class="game-grid"><label>プレイヤー名<input id="player-name" maxlength="20" autocomplete="off" placeholder="Player 1"></label><label id="room-code-label" class="hidden">ROOM CODE<input id="room-code" maxlength="6" autocomplete="off" placeholder="6文字"></label></div><div class="button-row"><button id="create-room" type="button">ルームを作成</button><button id="join-room" class="secondary-button" type="button">ルームに参加</button></div><p id="room-info" class="help-text"></p></div><div class="api-key-panel"><label for="game-api-key">Gemini APIキー</label><div class="api-key-row"><input id="game-api-key" type="password" value="" autocomplete="off" maxlength="512"><button id="clear-game-key" class="secondary-button" type="button">入力を消去</button></div><p class="help-text">処理中だけメモリに保持し、保存しません。APIキーの利用上限時は別キーへ切り替えて再試行できます。</p></div></section>
<section id="player-panel" class="card"><div class="game-step-heading"><span id="player-label">PLAYER 1</span><span id="step-label">候補レシートをアップロード</span></div><label class="file-picker-button game-file-label" for="game-files">JPEG/PNG/ZIPを選択（最大10枚）</label><input id="game-files" type="file" accept="image/jpeg,image/png,.zip,application/zip" multiple><p id="file-names" class="help-text">未選択</p><button id="upload-files" type="button">解析</button><p id="game-status" class="status" aria-live="polite"></p><div id="candidate-list" class="receipt-list"></div><div id="monster-panel" class="monster-panel hidden"></div><div class="button-row"><button id="lock-button" class="hidden" type="button">このモンスターでLOCK</button><button id="next-player" class="hidden secondary-button" type="button">PLAYER 2に交代</button></div></section><section id="game-detail-panel" class="card hidden" aria-live="polite"><div class="detail-heading"><h2>レシート詳細</h2><div class="button-row"><button id="close-game-detail" class="secondary-button" type="button">閉じる</button></div></div><p id="game-detail-meta" class="help-text"></p><div id="game-detail-bubble" class="receipt-bubble"></div></section><section id="battle-result" class="card hidden"><h2>MONSTER OPEN</h2><div id="battle-content"></div></section></main><script src="./config.js?v=receipt-game-v1"></script><script src="./game-file-utils.js?v=receipt-game-zip-v1"></script><script src="./game.js?v=receipt-game-api-key-reset-v2"></script></body></html>
