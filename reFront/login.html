<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    #login-form input[type="text"],
    #login-form input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #9ca3af;
      border-radius: 10px;
      background: #fff;
    }
  </style>
  <script>
    (() => {
      const indexUrl = new URL("./index.html", window.location.href);
      try {
        const referrerUrl = document.referrer ? new URL(document.referrer) : null;
        if (!referrerUrl || referrerUrl.origin !== indexUrl.origin || referrerUrl.pathname !== indexUrl.pathname) {
          window.location.replace(indexUrl.href);
        }
      } catch {
        window.location.replace(indexUrl.href);
      }
    })();
  </script>
</head>
<body>
  <main class="container">
    <p><a href="./index.html">← メニューへ戻る</a></p>
    <section class="card">
      <h1>ログイン</h1>
      <form id="login-form">
        <label for="user-id">ユーザID</label>
        <input id="user-id" name="userId" type="text" autocomplete="username" required>
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">ログイン</button>
        <p id="login-status" class="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const status = document.getElementById("login-status");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (form.elements.userId.value === "edix" && form.elements.password.value === "edix") {
        // select.htmlの既存の直接アクセスガードに、index.html経由であることを伝える。
        window.history.replaceState(null, "", "./index.html");
        window.location.href = "./select.html";
        return;
      }

      status.textContent = "ユーザIDまたはパスワードが正しくありません。";
    });
  </script>
</body>
</html>
