<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>レシート解析</title>
  <link rel="stylesheet" href="./styles.css?v=20260821-2">
</head>
<body>
  <main class="container">
    <p><a href="./index.html">← メニューへ戻る</a></p>
    <section class="card">
      <h1>レシート解析</h1>
      <p>JPEG / PNG / ZIP のレシート画像を選択し、Gemini APIキーを入力してください。ZIPは複数のレシート画像をまとめて解析できます。ZIPの中身はJPEG/PNGだけにしてください。「解析」は文字抽出と表示だけを行い、PostgreSQLには登録しません。内容を確認後、「PostgreSQLへ保存」を押すと解析結果を保存します。</p>
      <form id="receipt-form">
        <div class="file-input-list">
          <div class="file-picker-row"><label class="file-picker-button" for="receipt-file-1">ファイルを選択</label><input id="receipt-file-1" name="file" type="file" accept="image/jpeg,image/png,.zip,application/zip"><span id="receipt-file-name-1" class="selected-file-name">未選択</span></div>
        </div>
        <div id="api-key-panel" class="api-key-panel">
          <label class="file-label" for="gemini-api-key">Gemini APIキー</label>
          <div class="api-key-row">
            <input id="gemini-api-key" name="geminiApiKey" type="password" autocomplete="off" spellcheck="false" maxlength="512" aria-describedby="api-key-note" required>
            <button id="clear-api-key" class="secondary-button" type="button">入力を消去</button>
          </div>
          <p id="api-key-note" class="help-text">この値だけをGemini API呼び出しに使用します。APIキーは保存しません。</p>
        </div>
        <div class="button-row">
          <button id="submit-button" type="submit">解析</button>
          <button id="save-button" class="secondary-button hidden" type="button" disabled>PostgreSQLへ保存</button>
        </div>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
    </section>
    <section id="result-card" class="card hidden" aria-live="polite">
      <h2>解析結果</h2>
      <div id="receipt-results"></div>
    </section>
  </main>
  <script src="./config.js?v=20260827-api"></script>
  <script src="./app.js?v=20260827-zip-directories-timeout"></script>
</body>
</html>
